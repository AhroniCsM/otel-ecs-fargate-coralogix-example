AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MoH HUB OTel POC - stack 2/2 (compute).
  One ECS Fargate cluster and three services - the Coralogix collector,
  the two auto-instrumented applications (edge-dotnet, hub-python), and the
  always-on traffic generator - wired together with ECS Service Connect.

Parameters:
  ProjectName:
    Type: String
    Default: moh-hub-otel

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Any VPC with outbound internet access (the default VPC is fine).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      A PUBLIC subnet in that VPC. Fargate tasks get AssignPublicIp=ENABLED so
      they can reach ECR / SQS / Coralogix without a NAT gateway.

  ImageTag:
    Type: String
    Default: latest

  CoralogixDomain:
    Type: String
    Default: eu2.coralogix.com
    Description: CUSTOMER - your Coralogix region domain (eu1/eu2/us1/us2/ap1...).

  # CUSTOMER: this is what shows up as the Environment in Coralogix APM, and it
  # is how you keep stg and prod telemetry apart in one account. Change it per
  # deployment (ecs-stg-example / ecs-prod / ...).
  DeploymentEnvironmentName:
    Type: String
    Default: ecs-stg-exmaple
    Description: Value for the deployment.environment.name resource attribute.

  CoralogixKeyParameter:
    Type: String
    Default: /moh-hub-otel/coralogix-private-key
    Description: >
      Name of the SSM Parameter Store SecureString holding your Coralogix
      Send-Your-Data API key. The key itself is never in this template or in git.

Resources:

  # ===========================================================================
  #  Service discovery - backs ECS Service Connect
  # ===========================================================================
  #  Every task talks to every other task by service name (e.g.
  #  http://otel-collector:4318, http://hub-python:8081) instead of localhost,
  #  because on Fargate (networkMode=awsvpc) each task gets its own ENI/IP.
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${ProjectName}.local'
      Vpc: !Ref VpcId

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      ClusterSettings:
        # Disabled = no extra CloudWatch charges. All telemetry goes to Coralogix.
        - Name: containerInsights
          Value: disabled
      ServiceConnectDefaults:
        Namespace: !GetAtt Namespace.Arn

  # ===========================================================================
  #  Networking
  # ===========================================================================
  #  All tasks share one security group and are reachable from each other on
  #  any port (self-referencing ingress) - service-to-service traffic now runs
  #  over each task's own ENI instead of localhost. Use SSM Session Manager /
  #  `aws ecs execute-command` if you need a shell - no SSH key, no port 22.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} Fargate tasks'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: ECR, SQS, SSM and Coralogix egress

  TaskSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      IpProtocol: -1
      Description: Allow tasks in this security group to reach each other

  # ===========================================================================
  #  TASK DEFINITION 1 - the Coralogix collector (normal REPLICA service)
  # ===========================================================================
  #  Fargate has no DAEMON scheduling strategy (no EC2 hosts to run one-per).
  #  Instead this runs as a single REPLICA service, published via ECS Service
  #  Connect as "otel-collector" so every application task can reach it at
  #  http://otel-collector:4318 regardless of which ENI it's actually on.
  CollectorTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-otel-collector'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-exec-role'
      ContainerDefinitions:
        - Name: otel-collector
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}/otel-collector:${ImageTag}'
          Essential: true
          # 448 MiB: the spanmetrics connector holds an in-memory aggregation of
          # every service/operation/dimension combination until it flushes.
          Memory: 448
          PortMappings:
            - ContainerPort: 4317
              Name: otel-grpc
              AppProtocol: grpc
            - ContainerPort: 4318
              Name: otel-http
              AppProtocol: http
          Environment:
            - Name: CORALOGIX_DOMAIN
              Value: !Ref CoralogixDomain
          Secrets:
            # Pulled from SSM Parameter Store by the ECS agent at start time.
            # The value never appears in the task definition or in CloudTrail.
            - Name: CORALOGIX_PRIVATE_KEY
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CoralogixKeyParameter}'
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -qO- http://localhost:13133/ || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${ProjectName}-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel-collector

  CollectorService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: otel-collector
      Cluster: !Ref Cluster
      TaskDefinition: !Ref CollectorTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref TaskSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn
        Services:
          - PortName: otel-http
            DiscoveryName: otel-collector
            ClientAliases:
              - Port: 4318
                DnsName: otel-collector

  # ===========================================================================
  #  TASK DEFINITION 2 - edge-dotnet   (ALB + API Gateway / F5)
  # ===========================================================================
  EdgeDotnetTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-edge-dotnet'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-exec-role'
      TaskRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-task-role'
      ContainerDefinitions:
        - Name: edge-dotnet
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}/edge-dotnet:${ImageTag}'
          Essential: true
          Memory: 512
          PortMappings:
            - ContainerPort: 8080
              Name: edge-dotnet
              AppProtocol: http
          Environment:
            # ---- THE ONLY OPENTELEMETRY CONFIGURATION THAT EXISTS ----------
            - Name: OTEL_SERVICE_NAME              # -> Coralogix subsystem
              Value: edge-dotnet
            - Name: OTEL_RESOURCE_ATTRIBUTES       # service.namespace -> Coralogix application
              # service.namespace       -> Coralogix APPLICATION
              # deployment.environment.name -> Coralogix ENVIRONMENT
              #   (`deployment.environment` is the deprecated spelling; we set
              #    both so older SDKs and tooling still pick it up)
              Value: !Sub 'service.namespace=moh-hub-poc,deployment.environment.name=${DeploymentEnvironmentName},deployment.environment=${DeploymentEnvironmentName}'
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT    # the collector, via Service Connect
              Value: http://otel-collector:4318
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_TRACES_EXPORTER
              Value: otlp
            - Name: OTEL_METRICS_EXPORTER
              Value: otlp
            - Name: OTEL_LOGS_EXPORTER
              Value: otlp
            - Name: OTEL_TRACES_SAMPLER            # 100% - NO SAMPLING
              Value: always_on
            - Name: OTEL_PROPAGATORS
              Value: tracecontext,baggage
            # ---- application config ---------------------------------------
            # CUSTOMER: in your infra this is your internal API GW / Lambda URL.
            - Name: HUB_ROUTER_URL
              Value: http://hub-python:8081
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${ProjectName}-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: edge-dotnet

  EdgeDotnetService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: edge-dotnet
      Cluster: !Ref Cluster
      TaskDefinition: !Ref EdgeDotnetTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref TaskSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn
        Services:
          - PortName: edge-dotnet
            DiscoveryName: edge-dotnet
            ClientAliases:
              - Port: 8080
                DnsName: edge-dotnet

  # ===========================================================================
  #  TASK DEFINITION 3 - hub-python   (BLUE routing Lambda)
  # ===========================================================================
  HubPythonTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-hub-python'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-exec-role'
      TaskRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-task-role'
      ContainerDefinitions:
        - Name: hub-python
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}/hub-python:${ImageTag}'
          Essential: true
          Memory: 512
          PortMappings:
            - ContainerPort: 8081
              Name: hub-python
              AppProtocol: http
          Environment:
            - Name: OTEL_SERVICE_NAME
              Value: hub-python
            - Name: OTEL_RESOURCE_ATTRIBUTES
              # service.namespace       -> Coralogix APPLICATION
              # deployment.environment.name -> Coralogix ENVIRONMENT
              #   (`deployment.environment` is the deprecated spelling; we set
              #    both so older SDKs and tooling still pick it up)
              Value: !Sub 'service.namespace=moh-hub-poc,deployment.environment.name=${DeploymentEnvironmentName},deployment.environment=${DeploymentEnvironmentName}'
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: http://otel-collector:4318
            - Name: OTEL_EXPORTER_OTLP_PROTOCOL
              Value: http/protobuf
            - Name: OTEL_TRACES_EXPORTER
              Value: otlp
            - Name: OTEL_METRICS_EXPORTER
              Value: otlp
            - Name: OTEL_LOGS_EXPORTER
              Value: otlp
            - Name: OTEL_TRACES_SAMPLER
              Value: always_on
            - Name: OTEL_PROPAGATORS
              Value: tracecontext,baggage
            # Python-specific: stamp trace_id/span_id onto every stdlib log
            # record and ship the records over OTLP.
            - Name: OTEL_PYTHON_LOG_CORRELATION
              Value: 'true'
            - Name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              Value: 'true'
            # ---- application config ---------------------------------------
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: BLUE_QUEUE_URL
              Value: !ImportValue
                Fn::Sub: '${ProjectName}-blue-queue-url'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${ProjectName}-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: hub-python

  HubPythonService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: hub-python
      Cluster: !Ref Cluster
      TaskDefinition: !Ref HubPythonTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref TaskSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn
        Services:
          - PortName: hub-python
            DiscoveryName: hub-python
            ClientAliases:
              - Port: 8081
                DnsName: hub-python

  # ===========================================================================
  #  TASK DEFINITION 4 - loadgen   (always-on demo traffic)
  # ===========================================================================
  #  CUSTOMER: DELETE this. Your real clinics are the traffic.
  #  Deliberately NOT instrumented, so the root span of every trace is your own
  #  edge service - exactly like production.
  LoadgenTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-loadgen'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${ProjectName}-exec-role'
      ContainerDefinitions:
        - Name: loadgen
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}/loadgen:${ImageTag}'
          Essential: true
          Memory: 128
          Environment:
            - Name: EDGE_URL
              Value: http://edge-dotnet:8080
            # ~6 BLUE transactions/minute. Enough for continuous APM data,
            # small enough to stay cheap.
            - Name: INTERVAL
              Value: '10'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${ProjectName}-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: loadgen

  LoadgenService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: loadgen
      Cluster: !Ref Cluster
      TaskDefinition: !Ref LoadgenTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref TaskSecurityGroup]
      # Client-only: loadgen calls edge-dotnet by Service Connect name but
      # publishes nothing of its own, so there is no `Services` list.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn

Outputs:
  ClusterName:
    Value: !Ref Cluster
  Note:
    Value: >
      Give it ~3 minutes, then query Coralogix:
      cx spans "filter $l.applicationName == 'moh-hub-poc'" --start now-15m
