# =============================================================================
#  Coralogix OpenTelemetry Collector (CDOT) — ECS Fargate service
# =============================================================================
#  Runs as a normal (REPLICA) ECS Fargate service, discoverable by every other
#  task via ECS Service Connect at http://otel-collector:4318.
#
#  This file is the ONLY place where telemetry is shaped. Note especially the
#  `transform/hub_message_id` processor: it lifts the Ministry of Health
#  business GUID onto the span as a first-class attribute WITHOUT any of the
#  applications writing a single line of OpenTelemetry code.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protects the collector on a small instance. Tune limit_mib to ~75% of the
  # container's memory reservation.
  memory_limiter:
    check_interval: 2s
    limit_mib: 380
    spike_limit_mib: 90

  # Adds cloud.*, aws.ecs.* resource attributes so you can slice APM by
  # cluster / task in Coralogix. No `ec2` detector: on Fargate there is no EC2
  # host to introspect.
  resourcedetection/ecs:
    detectors: [env, ecs]
    timeout: 5s
    override: false

  # ===========================================================================
  #  THE CORRELATION PROCESSOR  —  read this one carefully
  # ===========================================================================
  #  The Ministry of Health identifies every business transaction with a GUID
  #  (`hub_message_id` / `message_id`) from the JSON contract, independent of
  #  the OpenTelemetry trace ID.
  #
  #  The applications simply carry that GUID in the request URL (query string).
  #  Every OpenTelemetry auto-instrumentation records the URL on its HTTP spans
  #  for free. So here — in infrastructure config, not application code — we
  #  parse the GUID out of the URL and promote it to `hub.message_id`.
  #
  #  Result in Coralogix: one search on `hub.message_id` returns every span and
  #  log line for that business transaction, with zero application code.
  #
  #  We try several attribute names because different language SDKs are on
  #  different HTTP semantic-convention versions.
  # ===========================================================================
  transform/hub_message_id:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # (a) stable semconv, client spans:  url.full
          - 'set(cache["a"], ExtractPatterns(attributes["url.full"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["url.full"] != nil'
          - 'set(attributes["hub.message_id"], cache["a"]["id"]) where cache["a"] != nil'
          # (b) stable semconv, server spans:  url.query
          - 'set(cache["b"], ExtractPatterns(attributes["url.query"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["url.query"] != nil'
          - 'set(attributes["hub.message_id"], cache["b"]["id"]) where attributes["hub.message_id"] == nil and cache["b"] != nil'
          # (c) legacy semconv, client spans:  http.url
          - 'set(cache["c"], ExtractPatterns(attributes["http.url"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["http.url"] != nil'
          - 'set(attributes["hub.message_id"], cache["c"]["id"]) where attributes["hub.message_id"] == nil and cache["c"] != nil'
          # (d) legacy semconv, server spans:  http.target
          - 'set(cache["d"], ExtractPatterns(attributes["http.target"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["http.target"] != nil'
          - 'set(attributes["hub.message_id"], cache["d"]["id"]) where attributes["hub.message_id"] == nil and cache["d"] != nil'
          # Tag the MoH flow this span belongs to, for easy filtering.
          - 'set(attributes["moh.flow"], "blue") where IsMatch(attributes["hub.message_id"], ".")'

    # Same idea for LOGS. Auto-instrumentation already attached trace_id/span_id
    # to every log record, so once `hub.message_id` is here too you can go
    # GUID -> log -> trace with one click.
    #
    # Two shapes to handle:
    #  * Python renders the GUID into the message text, so we parse the body.
    #  * .NET ILogger keeps the message TEMPLATE in the body and puts the
    #    structured parameters in attributes, so we read the attribute directly.
    log_statements:
      - context: log
        statements:
          # .NET structured-logging parameter, e.g.
          #   log.LogInformation("... hub_message_id={hub_message_id}", id)
          - 'set(attributes["hub.message_id"], attributes["hub_message_id"]) where attributes["hub_message_id"] != nil'
          # Python rendered text
          - 'set(cache["a"], ExtractPatterns(body, "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and body != nil'
          - 'set(attributes["hub.message_id"], cache["a"]["id"]) where attributes["hub.message_id"] == nil and cache["a"] != nil'

  # ===========================================================================
  #  APM TRANSACTION DETECTION  —  required for the full APM experience
  # ===========================================================================
  #  Without this processor you get traces, but Coralogix APM cannot group them
  #  into business transactions: the `cgx.transaction` and
  #  `cgx.transaction.root` span attributes are missing, and the APM
  #  Transactions / Service Catalog views stay empty.
  #  It walks each trace, picks the entry-point span, and stamps the whole
  #  trace with the transaction name.
  #
  #  NOTE: `transactions.enabled` defaults to FALSE. `coralogix: {}` validates
  #  happily and does nothing at all -- you get no error, just permanently empty
  #  APM Transaction views. You must switch it on explicitly.
  #  STATUS (verified on CDOT v0.5.13/0.5.15): this processor loads and logs
  #  "Development component. May change in the future.", but did NOT populate
  #  `cgx.transaction` / `cgx.transaction.root` in our testing -- with or
  #  without a `groupbytrace` processor in front of it to batch whole traces.
  #  Everything else in APM works without it (service catalog, RED metrics,
  #  latency, service map, error rates all come from the spans and the span
  #  metrics below). Only the APM *Transactions* grouping view depends on it.
  #  Left configured and switched on; revisit on a newer CDOT release.
  coralogix:
    transactions:
      enabled: true

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  # -------------------------------------------------------------------------
  # CUSTOMER: this is the whole Coralogix integration.
  #   CORALOGIX_DOMAIN      e.g. eu2.coralogix.com / us2.coralogix.com
  #   CORALOGIX_PRIVATE_KEY a "Send-Your-Data" API key
  # Both are injected by the ECS task definition from SSM Parameter Store.
  # -------------------------------------------------------------------------
  coralogix:
    domain: "${env:CORALOGIX_DOMAIN}"
    private_key: "${env:CORALOGIX_PRIVATE_KEY}"
    # Fallbacks, used only when the attributes below are absent.
    application_name: "moh-hub-poc"
    subsystem_name: "unknown"
    # Derive Coralogix application/subsystem from OTel resource attributes.
    application_name_attributes:
      - "service.namespace"
    subsystem_name_attributes:
      - "service.name"
    timeout: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  # Uncomment while troubleshooting to print spans to the container log.
  # debug:
  #   verbosity: detailed

connectors:
  # ===========================================================================
  #  APM SERVICE METRICS  —  RED metrics derived from the spans themselves
  # ===========================================================================
  #  Produces calls_total + duration histograms per service/operation, which is
  #  what drives the APM latency, throughput and error-rate charts. Generated
  #  locally from spans you are already sending, so it costs no extra spans.
  spanmetrics:
    histogram:
      explicit:
        # Coralogix's recommended default buckets for ECS/EC2.
        buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
    # CUSTOMER: BE CAREFUL HERE. Every dimension multiplies the number of time
    # series. These are all low-cardinality and safe.
    # NEVER add a dimension whose value is unbounded -- and `hub.message_id` is
    # a GUID per transaction, so adding it here would create one time series per
    # request and blow up both cardinality and cost. Keep the GUID on SPANS
    # (where it belongs) and off METRICS.
    dimensions:
      - name: http.request.method
      - name: http.response.status_code
      - name: messaging.system
    metrics_expiration: 5m
    exemplars:
      # Attaches example trace IDs to the metrics, so you can jump from a
      # latency spike straight into a representative trace.
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # NOTE: no tail_sampling / probabilistic_sampler anywhere in this file.
  # 100% of spans are forwarded to Coralogix, as required for the POC.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, transform/hub_message_id, coralogix, batch]
      # Two destinations: Coralogix, and the spanmetrics connector which feeds
      # the metrics pipeline below.
      exporters: [coralogix, spanmetrics]
    metrics:
      # OTLP = the SDKs' own runtime/HTTP metrics.
      # spanmetrics = the APM RED metrics derived from the traces above.
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resourcedetection/ecs, batch]
      exporters: [coralogix]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, transform/hub_message_id, batch]
      exporters: [coralogix]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
