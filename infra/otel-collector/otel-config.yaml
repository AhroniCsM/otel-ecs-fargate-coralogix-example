# =============================================================================
#  Coralogix OpenTelemetry Collector (CDOT) — ECS Fargate service
# =============================================================================
#  Runs as a normal (REPLICA) ECS Fargate service, discoverable by every other
#  task via ECS Service Connect at http://otel-collector:4318.
#
#  The span-metrics / transactions / db-metrics configuration below is a
#  faithful port of what the official Coralogix `otel-integration` Helm chart
#  generates for Kubernetes (rendered from the chart and adapted for ECS), so
#  the metric names and dimensions are EXACTLY what the Coralogix APM UI
#  (Service Catalog, Transactions, Database Catalog) queries:
#
#    calls_total, duration_ms_bucket/_sum/_count      <- APM RED metrics
#    db_calls_total, db_duration_ms_bucket/_sum/_count <- Database Catalog
#
#  NOTE the namespace: "" on the spanmetrics connector. Without it the
#  connector prefixes everything (traces_span_metrics_calls_total) and the
#  APM UI, which queries `calls_total`, stays empty.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protects the collector on a small instance. Tune limit_mib to ~75% of the
  # container's memory reservation.
  memory_limiter:
    check_interval: 2s
    limit_mib: 380
    spike_limit_mib: 90

  # Adds cloud.*, aws.ecs.* resource attributes so you can slice APM by
  # cluster / task in Coralogix.
  resourcedetection/ecs:
    detectors: [env, ecs]
    timeout: 5s
    override: false

  # ===========================================================================
  #  THE CORRELATION PROCESSOR — promotes the MoH business GUID from the
  #  request URL onto every span and log record. See README.
  # ===========================================================================
  transform/hub_message_id:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'set(cache["a"], ExtractPatterns(attributes["url.full"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["url.full"] != nil'
          - 'set(attributes["hub.message_id"], cache["a"]["id"]) where cache["a"] != nil'
          - 'set(cache["b"], ExtractPatterns(attributes["url.query"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["url.query"] != nil'
          - 'set(attributes["hub.message_id"], cache["b"]["id"]) where attributes["hub.message_id"] == nil and cache["b"] != nil'
          - 'set(cache["c"], ExtractPatterns(attributes["http.url"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["http.url"] != nil'
          - 'set(attributes["hub.message_id"], cache["c"]["id"]) where attributes["hub.message_id"] == nil and cache["c"] != nil'
          - 'set(cache["d"], ExtractPatterns(attributes["http.target"], "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and attributes["http.target"] != nil'
          - 'set(attributes["hub.message_id"], cache["d"]["id"]) where attributes["hub.message_id"] == nil and cache["d"] != nil'
          - 'set(attributes["moh.flow"], "blue") where IsMatch(attributes["hub.message_id"], ".")'
    log_statements:
      - context: log
        statements:
          - 'set(attributes["hub.message_id"], attributes["hub_message_id"]) where attributes["hub_message_id"] != nil'
          - 'set(cache["a"], ExtractPatterns(body, "hub_message_id=(?P<id>[0-9a-fA-F-]{36})")) where attributes["hub.message_id"] == nil and body != nil'
          - 'set(attributes["hub.message_id"], cache["a"]["id"]) where attributes["hub.message_id"] == nil and cache["a"] != nil'

  # Bridge new/old HTTP semconv so the spanmetrics dimensions (http.method,
  # http.response.status_code) populate regardless of agent generation.
  # (Verbatim from the Coralogix otel-integration chart.)
  transform/semconv:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'set(span.attributes["http.method"], span.attributes["http.request.method"]) where span.attributes["http.request.method"] != nil'
          - 'set(span.attributes["http.response.status_code"], span.attributes["http.status_code"]) where span.attributes["http.response.status_code"] == nil and span.attributes["http.status_code"] != nil'

  # ===========================================================================
  #  APM TRANSACTION DETECTION — cgx.transaction / cgx.transaction.root
  # ===========================================================================
  #  The coralogix processor stamps each span with its transaction name, which
  #  the APM Transactions view and the cgx.* span-metric dimensions rely on.
  #  IT ONLY WORKS ON WHOLE TRACES: groupbytrace must run immediately before
  #  it so the processor sees every span of a trace in one batch. (This
  #  ordering is exactly what the official chart does; without groupbytrace
  #  the cgx.* attributes never populate.)
  groupbytrace/transactions:
    wait_duration: 30s
  coralogix:
    transactions:
      enabled: true

  # Only database CLIENT spans may feed the db spanmetrics connector.
  # (Verbatim from the chart: drop spans with no db.system[.name].)
  filter/db_spanmetrics:
    traces:
      span:
        - 'attributes["db.system"] == nil and attributes["db.system.name"] == nil'

  # Normalise db semconv across agent generations so the Database Catalog
  # dimensions (db.namespace / db.operation.name / db.collection.name) are
  # populated whether the agent emits OLD (db.name, db.operation, db.sql.table)
  # or NEW (db.namespace, db.system.name, ...) attribute names.
  transform/db:
    error_mode: silent
    trace_statements:
      - context: span
        statements:
          # chart-verbatim: new -> old for db.system
          - 'set(attributes["db.system"], attributes["db.system.name"]) where attributes["db.system.name"] != nil and attributes["db.system"] == nil'
          # old -> new, for agents on old db semconv (e.g. Python 0.50b psycopg2)
          - 'set(attributes["db.namespace"], attributes["db.name"]) where attributes["db.namespace"] == nil and attributes["db.name"] != nil'
          - 'set(attributes["db.operation.name"], attributes["db.operation"]) where attributes["db.operation.name"] == nil and attributes["db.operation"] != nil'
          - 'set(attributes["db.collection.name"], attributes["db.sql.table"]) where attributes["db.collection.name"] == nil and attributes["db.sql.table"] != nil'
          # dbapi-style instrumentations name the span after the SQL verb but
          # set no db.operation attribute -- promote the span name so the
          # db.operation.name dimension (Database Catalog "Operations") fills.
          - 'set(attributes["db.operation.name"], name) where attributes["db.operation.name"] == nil and attributes["db.system"] != nil'

  # Maps the spanmetrics connector's otel.status_code datapoint attribute to
  # the status.code label the Coralogix APM UI expects. (Chart-verbatim.)
  transform/spanmetrics:
    error_mode: silent
    metric_statements:
      - context: datapoint
        statements:
          - 'set(datapoint.attributes["status.code"], "STATUS_CODE_ERROR") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "ERROR"'
          - 'set(datapoint.attributes["status.code"], "STATUS_CODE_OK") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"] == "OK"'
          - 'set(datapoint.attributes["status.code"], "STATUS_CODE_UNSET") where datapoint.attributes["status.code"] == nil and instrumentation_scope.name == "spanmetricsconnector" and (datapoint.attributes["otel.status_code"] == "UNSET" or datapoint.attributes["otel.status_code"] == nil)'

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  # -------------------------------------------------------------------------
  # CUSTOMER: this is the whole Coralogix integration.
  #   CORALOGIX_DOMAIN      e.g. eu2.coralogix.com / us2.coralogix.com
  #   CORALOGIX_PRIVATE_KEY a "Send-Your-Data" API key
  # Both are injected by the ECS task definition from SSM Parameter Store.
  # -------------------------------------------------------------------------
  coralogix:
    domain: "${env:CORALOGIX_DOMAIN}"
    private_key: "${env:CORALOGIX_PRIVATE_KEY}"
    application_name: "moh-hub-poc"
    subsystem_name: "unknown"
    application_name_attributes:
      - "service.namespace"
    subsystem_name_attributes:
      - "service.name"
    timeout: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

connectors:
  # Routes a copy of the trace stream into the db-metrics pipeline.
  forward/db: {}

  # ===========================================================================
  #  APM SERVICE METRICS — calls_total / duration_ms_* (chart-verbatim)
  # ===========================================================================
  #  namespace: "" is what makes the metric arrive as `calls_total` instead of
  #  `traces_span_metrics_calls_total` — the APM UI queries the former.
  spanmetrics:
    namespace: ""
    aggregation_cardinality_limit: 100000
    dimensions:
      - name: http.method
      - name: cgx.transaction
      - name: cgx.transaction.root
      - name: status_code
      - name: db.namespace
      - name: db.operation.name
      - name: db.collection.name
      - name: db.system
      - name: http.response.status_code
      - name: rpc.grpc.status_code
      - name: service.version
      - name: messaging.system
    exclude_dimensions:
      - collector.instance.id
    histogram:
      unit: ms
      explicit:
        buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
    metrics_expiration: 5m
    metrics_flush_interval: 30s
    exemplars:
      enabled: true

  # ===========================================================================
  #  DATABASE CATALOG METRICS — db_calls_total / db_duration_ms_* (chart-verbatim)
  # ===========================================================================
  #  Fed only with database CLIENT spans (see traces/db pipeline). The `db`
  #  namespace is what produces the db_-prefixed names the Database Catalog
  #  queries.
  spanmetrics/db:
    namespace: db
    aggregation_cardinality_limit: 100000
    dimensions:
      - name: db.namespace
      - name: db.operation.name
      - name: db.collection.name
      - name: db.system
      - name: service.version
    exclude_dimensions:
      - collector.instance.id
    histogram:
      unit: ms
      explicit:
        buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
    metrics_expiration: 5m
    metrics_flush_interval: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # NOTE: no tail_sampling / probabilistic_sampler anywhere in this file.
  # 100% of spans are forwarded to Coralogix.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, transform/hub_message_id, transform/semconv, groupbytrace/transactions, coralogix, batch]
      # Four destinations: Coralogix itself, the APM spanmetrics connector,
      # and (via forward/db) the db-metrics pipeline below.
      exporters: [coralogix, spanmetrics, forward/db]
    traces/db:
      receivers: [forward/db]
      processors: [filter/db_spanmetrics, transform/db, batch]
      exporters: [spanmetrics/db]
    metrics:
      # OTLP = the SDKs' own runtime metrics.
      # spanmetrics + spanmetrics/db = the APM / Database Catalog metrics.
      receivers: [otlp, spanmetrics, spanmetrics/db]
      processors: [memory_limiter, resourcedetection/ecs, transform/spanmetrics, batch]
      exporters: [coralogix]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, transform/hub_message_id, batch]
      exporters: [coralogix]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
